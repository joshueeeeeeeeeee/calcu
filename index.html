<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="calcu.css" />
    <title>Calculator</title>
  </head>
  <body>
    <!-- Clickable background -->
    <div class="scene">
      <button type="button" class="sun" title="Click me!" aria-label="Sun" onclick="clickSun(this)"></button>
      <button type="button" class="bubble b1" title="Pop me!" aria-label="Bubble" onclick="popBubble(this)"></button>
      <button type="button" class="bubble b2" title="Pop me!" aria-label="Bubble" onclick="popBubble(this)"></button>
      <button type="button" class="bubble b3" title="Pop me!" aria-label="Bubble" onclick="popBubble(this)"></button>
      <button type="button" class="bubble b4" title="Pop me!" aria-label="Bubble" onclick="popBubble(this)"></button>
      <button type="button" class="bubble b5" title="Pop me!" aria-label="Bubble" onclick="popBubble(this)"></button>
    </div>

    <!-- Characters that pop out when the SURPRISE! button is clicked -->
    <img class="buddy buddy-left" src="gumblee.png" alt="Gumball" draggable="false" />
    <img class="buddy buddy-right" src="darwinn.png" alt="Darwin" draggable="false" />

    <div class="calculator">
      <form name="form1">
        <input type="text" name="textview" readonly />
      </form>
      <section class="buttons">
        <button type="button" class="btn-clear" onclick="clearScreen()">
          C
        </button>
        <button type="button" class="btn-func" onclick="backspace()">⌫</button>
        <button type="button" class="btn-op" onclick="insert('/')">/</button>
        <button type="button" class="btn-op" onclick="insert('*')">×</button>


        <button type="button" onclick="insert('7')">7</button>
        <button type="button" onclick="insert('8')">8</button>
        <button type="button" onclick="insert('9')">9</button>
        <button type="button" class="btn-op" onclick="insert('-')">-</button>


        <button type="button" onclick="insert('4')">4</button>
        <button type="button" onclick="insert('5')">5</button>
        <button type="button" onclick="insert('6')">6</button>
        <button type="button" class="btn-op" onclick="insert('+')">+</button>


        <button type="button" onclick="insert('1')">1</button>
        <button type="button" onclick="insert('2')">2</button>
        <button type="button" onclick="insert('3')">3</button>
        <button type="button" class="btn-equal" onclick="equal()">=</button>


        <button type="button" class="btn-zero" onclick="insert('0')">0</button>
        <button type="button" onclick="insert('.')">.</button>
      </section>

      <button type="button" class="btn-surprise" onclick="toggleBuddies(this)">SURPRISE!</button>
    </div>


    <script src="calcu.js"></script>
  </body>
</html>
